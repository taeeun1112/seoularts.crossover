  <!-- Page Header -->

  <!-- Marquee -->
  <div class="marquee">
    <div class="marquee-track">

        <span>태평가</span><span class="marquee-dot">•</span>

        <span>수양대군 · 현덕왕후 · 마침표의 또 다른 이름은</span><span class="marquee-dot">•</span>
        <span>Whimori</span><span class="marquee-dot">•</span>
        <span>처용가</span><span class="marquee-dot">•</span>
        <span>고성오광대</span><span class="marquee-dot">•</span>
      </div>
      <div class="marquee-group" aria-hidden="true">

        <span>끝서리</span><span class="marquee-dot">•</span>
        <span>심중전</span><span class="marquee-dot">•</span>
        <span>수양대군 · 현덕왕후 · 마침표의 또 다른 이름은</span><span class="marquee-dot">•</span>
        <span>Whimori</span><span class="marquee-dot">•</span>

  <!-- Song Filter Navigation -->
  <div class="container" style="text-align: center;">
    <nav class="program-nav" id="programNav">

    <!-- Page Search Box -->
    <div class="program-search-box">
      <div class="program-search-wrapper">

        <input type="text" id="programSearchInput" class="program-search-input" placeholder="응원의 목소리를 들려주세요!" autocomplete="off">

  <!-- Program Content -->
  <main class="container">
    <!-- Search Results Container -->
    <div id="programSearchContainer" style="display: none; margin-top: 20px; min-height: 300px; padding-bottom: 40px;">

    <!-- Staff Section -->

        <!-- Generated by JS -->

  <!-- Footer -->
  <footer class="footer">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    // ==========================================
    // Render Individual Profile Card (Horizontal layout)
    // ==========================================
    function renderIndividualCard(performer, songTitle) {
      const initial = performer.name.charAt(0);
      const imgPath = `assets/profiles/${performer.name}.jpg`;
      const bgColor = getInitialBg(performer.name);

      return `
        <div class="timeline-card" onclick="openProfileModalByName('${performer.name}')">
          <div class="timeline-photo-wrapper" style="background:${bgColor}">
            <img
              class="timeline-photo"
              src="${imgPath}"
              alt="${performer.name.replace(/\(.*?\)/g, '')}"
              loading="lazy"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            >
            <div class="profile-initials" style="display:none;">${initial}</div>
          </div>
          <div class="timeline-info-wrapper">
            <div class="timeline-card-meta">${songTitle}</div>
            <div class="timeline-card-identity">
              <div class="timeline-card-role">${performer.role}</div>
              <div class="timeline-card-name">${performer.name.replace(/\(.*?\)/g, '')}</div>
            </div>
          </div>
        </div>
      `;
    }

    // Helper to group performers by their role
    function groupPerformersByRole(performers) {
      const groups = [];
      performers.forEach(p => {
        let group = groups.find(g => g.role === p.role);
        if (!group) {
          group = { role: p.role, members: [] };
          groups.push(group);
        }
        group.members.push(p);
      });
      // Sort members in each group alphabetically
      groups.forEach(g => {
        g.members.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
      });
      return groups;
    }

    // ==========================================
    // Render Song Sections
    // ==========================================
    function renderProgram(filter = 'all') {
      const container = document.getElementById('programContainer');
      container.innerHTML = '';

      // Sort programData by custom songOrder
      const songOrder = [
        '태평가',
        '나의 바람',
        '끝서리',
        '심중전',
        '수양대군 · 현덕왕후 · 마침표의 또 다른 이름은',
        'Whimori',
        '처용가',
        '고성오광대'
      ];
      const sortedSongs = [...programData].sort((a, b) => {
        const indexA = songOrder.indexOf(a.title);
        const indexB = songOrder.indexOf(b.title);
        return indexA - indexB;
      });

      const filteredSongs = filter === 'all'
        ? sortedSongs
        : sortedSongs.filter(s => s.id === parseInt(filter));

      filteredSongs.forEach(song => {
        const num = String(song.id).padStart(2, '0');
        const section = document.createElement('div');
        section.className = 'program-song';
        section.id = `song-${song.id}`;

        // Group performers by role, maintaining initial order (composers then musicians)
        const composers = song.performers
          .filter(p => p.role.includes('작곡'));
        const musicians = song.performers
          .filter(p => !p.role.includes('작곡'));

        const groupedComposers = groupPerformersByRole(composers);
        const groupedMusicians = groupPerformersByRole(musicians);
        const allGroups = [...groupedComposers, ...groupedMusicians];

        let html = `
          <div class="song-header">
            <div class="song-title-group">
              <h2 class="song-title">${song.title}</h2>
              <p class="song-composer">작곡 ${song.composer}</p>
            </div>
          </div>
          <div class="timeline-container">
            <div class="timeline-line"></div>
            ${allGroups.map((group, idx) => {
          const isLeft = idx % 2 === 0;
          const alignClass = isLeft ? 'left' : 'right';
          return `
                <div class="timeline-item ${alignClass} reveal" style="transition-delay: ${idx * 0.05}s">
                  <div class="timeline-cards-group">
                    ${group.members.map(m => renderIndividualCard(m, song.title)).join('')}
                  </div>
                </div>
              `;
        }).join('')}
          </div>
        `;

        section.innerHTML = html;
        container.appendChild(section);
      });

      // Re-init scroll reveal for new elements
      initReveal();
    }

    // ==========================================
    // Render Staff Section
    // ==========================================
    function renderStaff() {
      const container = document.getElementById('staffGrid');
      container.innerHTML = '';

      staffData.forEach((group, groupIdx) => {
        let sortedMembers;
        if (group.role === '기획') {
          const planningOrder = ['이유진', '이시헌', '이종은'];
          sortedMembers = [...group.members].sort((a, b) => {
            const indexA = planningOrder.indexOf(a.name);
            const indexB = planningOrder.indexOf(b.name);
            return indexA - indexB;
          });
        } else if (group.role === '무대') {
          const stageOrder = ['무대감독', '무대조감독'];
          sortedMembers = [...group.members].sort((a, b) => {
            const indexA = stageOrder.indexOf(a.role);
            const indexB = stageOrder.indexOf(b.role);
            return indexA - indexB;
          });
        } else {
          sortedMembers = [...group.members].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
        }
        const category = document.createElement('div');
        category.className = 'staff-category';

        let html = `
          <div class="staff-category-title">${group.role}</div>
          <div class="timeline-container">
            <div class="timeline-line"></div>
            <div class="timeline-item left reveal">
              <div class="timeline-cards-group">
                ${sortedMembers.map(m => renderIndividualCard(m, 'STAFF')).join('')}
              </div>
            </div>
          </div>
        `;
        category.innerHTML = html;
        container.appendChild(category);
      });
    }

    // ==========================================
    // Filter Navigation
    // ==========================================
    function initFilterNav() {
      const nav = document.getElementById('programNav');

      // Sort programData by custom songOrder
      const songOrder = [
        '태평가',
        '나의 바람',
        '끝서리',
        '심중전',
        '수양대군 · 현덕왕후 · 마침표의 또 다른 이름은',
        'Whimori',
        '처용가',
        '고성오광대'
      ];
      const sortedSongs = [...programData].sort((a, b) => {
        const indexA = songOrder.indexOf(a.title);
        const indexB = songOrder.indexOf(b.title);
        return indexA - indexB;
      });

      sortedSongs.forEach(song => {
        const pill = document.createElement('button');
        pill.className = 'program-nav-pill';
        pill.dataset.filter = song.id;
        pill.textContent = song.title;
        nav.appendChild(pill);
      });

      // Add staff pill
      const staffPill = document.createElement('button');
      staffPill.className = 'program-nav-pill';
      staffPill.dataset.filter = 'staff';
      staffPill.textContent = 'STAFF';
      nav.appendChild(staffPill);

      // Click handlers
      nav.querySelectorAll('.program-nav-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          // Update active state
          nav.querySelectorAll('.program-nav-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');

          const filter = pill.dataset.filter;

          if (filter === 'staff') {
            document.getElementById('programContainer').style.display = 'none';
            document.getElementById('staffContainer').style.display = 'block';
            document.getElementById('staffContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
          } else {
            document.getElementById('programContainer').style.display = 'block';
            document.getElementById('staffContainer').style.display = filter === 'all' ? 'block' : 'none';
            renderProgram(filter);

            if (filter !== 'all') {
              const target = document.getElementById(`song-${filter}`);
              if (target) {
                setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
              }
            }
          }
        });
      });
    }

    // ==========================================
    // Scroll Reveal (re-initializable)
    // ==========================================
    function initReveal() {
      const reveals = document.querySelectorAll('.reveal:not(.visible)');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.05, rootMargin: '0px 0px -20px 0px' });

      reveals.forEach(el => observer.observe(el));
    }

    // ==========================================
    // In-Page Search Logic
    // ==========================================
    function initInPageSearch() {
      const searchInput = document.getElementById('programSearchInput');
      const searchContainer = document.getElementById('programSearchContainer');
      const resultsGrid = document.getElementById('programSearchResultsGrid');
      const programContainer = document.getElementById('programContainer');
      const staffContainer = document.getElementById('staffContainer');
      const nav = document.getElementById('programNav');

      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();

        if (!query) {
          // Empty query: restore current filter view
          searchContainer.style.display = 'none';
          resultsGrid.innerHTML = '';
          
          // Check active navigation pill to restore the correct container
          const activePill = nav.querySelector('.program-nav-pill.active');
          const filter = activePill ? activePill.dataset.filter : 'all';
          
          if (filter === 'staff') {
            programContainer.style.display = 'none';
            staffContainer.style.display = 'block';
          } else {
            programContainer.style.display = 'block';
            staffContainer.style.display = filter === 'all' ? 'block' : 'none';
          }
          return;
        }

        // Hide main content
        programContainer.style.display = 'none';
        staffContainer.style.display = 'none';
        searchContainer.style.display = 'block';

        // Search in performers (programData) and staff (staffData)
        const matches = [];

        // 1. Search in performers
        programData.forEach(song => {
          song.performers.forEach(perf => {
            const cleanName = perf.name.replace(/\(.*?\)/g, '');
            if (cleanName.toLowerCase().includes(query)) {
              // Avoid duplicate matches for same person
              if (!matches.some(m => m.name === perf.name && m.role === perf.role)) {
                matches.push({
                  performer: perf,
                  songTitle: song.title
                });
              }
            }
          });
        });

        // 2. Search in staff
        staffData.forEach(group => {
          group.members.forEach(member => {
            const cleanName = member.name.replace(/\(.*?\)/g, '');
            if (cleanName.toLowerCase().includes(query)) {
              if (!matches.some(m => m.name === member.name && m.role === member.role)) {
                matches.push({
                  performer: member,
                  songTitle: 'STAFF'
                });
              }
            }
          });
        });

        // Render matches
        resultsGrid.innerHTML = '';
        if (matches.length === 0) {
          resultsGrid.innerHTML = `
            <div class="profile-empty-state" style="width: 100%;">
              검색 결과가 없습니다. 다른 이름으로 검색해 보세요.
            </div>
          `;
          return;
        }

        matches.forEach(match => {
          const cardHtml = renderIndividualCard(match.performer, match.songTitle);
          resultsGrid.insertAdjacentHTML('beforeend', cardHtml);
        });
      });
    }

    // ==========================================
    // Init
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      renderProgram();
      renderStaff();
      initFilterNav();
      initReveal();
      initInPageSearch();
    });
  </script>
