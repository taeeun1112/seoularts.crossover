<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 페이지 — 결 GYEOL</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 140px 24px 80px;
    }

    .login-card {
      max-width: 400px;
      margin: 100px auto 0;
      padding: 40px 32px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-elevated);
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .login-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .admin-dashboard {
      display: none;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .admin-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .logout-btn {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.3s var(--ease);
    }

    .logout-btn:hover {
      color: var(--text-primary);
      border-color: var(--text-primary);
      background: rgba(0, 0, 0, 0.03);
    }

    /* Admin Table Styling */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      margin-bottom: 40px;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    .admin-table th,
    .admin-table td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .admin-table th {
      background: rgba(0, 0, 0, 0.02);
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .admin-table tr:last-child td {
      border-bottom: none;
    }

    .admin-table tr:hover td {
      background: rgba(0, 0, 0, 0.01);
    }

    .col-id { width: 60px; font-family: var(--font-mono); color: var(--text-tertiary); }
    .col-date { width: 120px; color: var(--text-secondary); }
    .col-author { width: 120px; font-weight: 600; }
    .col-recipient { width: 120px; }
    .col-message { line-height: 1.5; word-break: break-all; }
    .col-action { width: 100px; text-align: center; }

    .delete-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #ff3b30;
      background: rgba(255, 59, 48, 0.08);
      border: 1px solid rgba(255, 59, 48, 0.2);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }

    .delete-btn:hover {
      background: #ff3b30;
      color: white;
      border-color: #ff3b30;
    }

    .badge-recipient {
      background: rgba(0, 0, 0, 0.05);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .badge-secret {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      font-size: 10px;
      font-weight: 600;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* Stats summary */
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--shadow-card);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
    }

    @media (max-width: 768px) {
      .admin-container {
        padding-top: 100px;
      }
      .admin-table th, .admin-table td {
        padding: 12px 10px;
        font-size: 13px;
      }
      .admin-table th:nth-child(1), .admin-table td:nth-child(1),
      .admin-table th:nth-child(2), .admin-table td:nth-child(2) {
        display: none; /* Hide ID & Date on small mobile screens */
      }
    }
  </style>
</head>

<body class="light-mode">

  <!-- Navigation -->
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand"><img src="assets/gyeol_calligraphy_no_slogan.png" class="gyeol-logo-nav"
          alt="결"></a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">ALL</a>
        <a href="program.html" class="nav-link">PROFILE</a>
        <a href="guestbook.html" class="nav-link">GUESTBOOK</a>
      </div>
    </div>
  </nav>

  <main class="admin-container">

    <!-- Password Login Form -->
    <div class="login-card" id="loginCard">
      <h2 class="login-title">관리자 로그인</h2>
      <p class="login-subtitle">방명록 관리를 위해 비밀번호를 입력해주세요.</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group" style="text-align: left;">
          <label class="form-label" for="adminPassword">비밀번호</label>
          <input class="form-input" type="password" id="adminPassword" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="form-submit" style="margin-top: 24px;">로그인</button>
      </form>
    </div>

    <!-- Admin Dashboard -->
    <div class="admin-dashboard" id="adminDashboard">
      <div class="admin-header">
        <h2 class="admin-title">방명록 관리자 패널</h2>
        <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
      </div>

      <div class="admin-stats">
        <div class="stat-card">
          <div class="stat-label">총 방명록 개수</div>
          <div class="stat-value" id="totalCount">—</div>
        </div>
      </div>

      <div class="table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th class="col-id">No</th>
              <th class="col-date">작성일</th>
              <th class="col-author">작성자</th>
              <th class="col-recipient">받는 사람</th>
              <th class="col-message">메시지 내용</th>
              <th class="col-action">관리</th>
            </tr>
          </thead>
          <tbody id="adminTableBody">
            <tr>
              <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-tertiary);">
                데이터를 로딩 중입니다...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-centered-content">
        <p class="footer-title">2026 응용음악I 결</p>
        <p class="footer-developer">Developed by Taeeun Woo</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    // Simple Admin Password Protection
    // 기본값은 '2026' 입니다. 필요 시 아래 값을 변경하세요.
    const ADMIN_PASSWORD_HASH = "2026";

    document.addEventListener('DOMContentLoaded', () => {
      // Check if already logged in this session
      if (sessionStorage.getItem('admin_logged_in') === 'true') {
        showDashboard();
      }
    });

    function handleLogin(e) {
      e.preventDefault();
      const pwInput = document.getElementById('adminPassword').value;

      if (pwInput === ADMIN_PASSWORD_HASH) {
        sessionStorage.setItem('admin_logged_in', 'true');
        showDashboard();
      } else {
        alert('비밀번호가 올바르지 않습니다.');
        document.getElementById('adminPassword').value = '';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('admin_logged_in');
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('adminDashboard').style.display = 'none';
      document.getElementById('adminPassword').value = '';
    }

    function showDashboard() {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('adminDashboard').style.display = 'block';
      loadAdminEntries();
    }

    // Load and render all entries for administration
    async function loadAdminEntries() {
      const tbody = document.getElementById('adminTableBody');
      const totalCountEl = document.getElementById('totalCount');

      try {
        const entries = await GuestbookApp.getEntries();
        totalCountEl.textContent = entries.length + "개";

        tbody.innerHTML = '';
        if (entries.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-tertiary);">
                등록된 방명록이 없습니다.
              </td>
            </tr>
          `;
          return;
        }

        entries.forEach((entry, index) => {
          const num = String(entries.length - index).padStart(2, '0');
          const date = new Date(entry.created_at).toLocaleDateString('ko-KR', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit'
          });

          const isSecret = isSecretMessage(entry.message);
          let rawMsg = entry.message;
          let secretBadge = '';

          if (isSecret) {
            secretBadge = `<span class="badge-secret">🔒 비밀</span>`;
            // For secret messages, decrypt and show the raw text to the admin for moderation
            rawMsg = entry.message.substring(8); // remove '[secret]' prefix
          }

          const recipientHtml = entry.recipient 
            ? `<span class="badge-recipient">To. ${escapeHtml(entry.recipient)}</span>`
            : '<span style="color:var(--text-tertiary);">—</span>';

          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="col-id">${num}</td>
            <td class="col-date">${date}</td>
            <td class="col-author">${escapeHtml(entry.nickname)}</td>
            <td class="col-recipient">${recipientHtml}</td>
            <td class="col-message">${secretBadge}${escapeHtml(rawMsg)}</td>
            <td class="col-action">
              <button class="delete-btn" onclick="deleteEntry('${entry.id || index}')">삭제</button>
            </td>
          `;
          tbody.appendChild(row);
        });

      } catch (error) {
        console.error('Failed to load admin entries:', error);
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; padding: 40px; color: #ff3b30;">
              데이터 로딩 에러: ${error.message || error}
            </td>
          </tr>
        `;
      }
    }

    async function deleteEntry(id) {
      if (!confirm('정말 이 방명록 메시지를 영구 삭제하시겠습니까?')) {
        return;
      }

      try {
        if (supabaseClient) {
          // If the ID is a uuid/bigint or we look it up
          // Supabase delete operation
          const { error } = await supabaseClient
            .from('guestbook_entries')
            .delete()
            .eq('id', id);

          if (error) throw error;
        } else {
          // localStorage fallback (for testing without key)
          let entries = JSON.parse(localStorage.getItem('gyeol_guestbook') || '[]');
          // If fallback ID is index
          if (isNaN(id)) {
            entries = entries.filter(e => e.id !== id);
          } else {
            const index = parseInt(id);
            entries.splice(index, 1);
          }
          localStorage.setItem('gyeol_guestbook', JSON.stringify(entries));
        }

        alert('성공적으로 삭제되었습니다.');
        loadAdminEntries();
      } catch (error) {
        console.error('Delete error:', error);
        alert('삭제 처리 중 오류가 발생했습니다: ' + (error.message || error));
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>

</html>
